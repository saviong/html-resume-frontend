# Deploys the résumé to Azure Static Web Apps (Free plan):
# managed TLS on mycv.saviong.com, global CDN, and the Python API on /api.
#
# The API lives in a separate repo, so it is checked out into api/ here.
# A backend-only change does not trigger this workflow — run it manually
# (Actions -> Deploy to Azure Static Web Apps -> Run workflow) after merging there.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend into api/
        uses: actions/checkout@v4
        with:
          repository: saviong/html-resume-backend
          ref: master
          path: backend

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html staticwebapp.config.json _site/
          cp -r pic _site/
          find _site -name '.DS_Store' -delete

      # Only what the Functions host needs: no tests, ARM templates or Archive/.
      - name: Stage API
        run: |
          mkdir -p api
          cp backend/function_app.py backend/host.json backend/requirements.txt api/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Vendor dependencies explicitly rather than relying on the Oryx build step.
      # Without them the worker fails to import and no functions are indexed,
      # which surfaces only as a 404 on /api/* with no error anywhere.
      - name: Vendor API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt --target="api/.python_packages/lib/site-packages"
          find api -name '__pycache__' -type d -prune -exec rm -rf {} + || true

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_site'
          api_location: 'api'
          skip_app_build: true
          skip_api_build: true
