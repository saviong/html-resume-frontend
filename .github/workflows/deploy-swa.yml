# Single deployment path for the résumé site and its API.
#
# Azure Static Web Apps uploads the static content and the managed Functions API
# as one atomic deployment -- there is no API-only deploy -- so a change in
# either repo has to publish both halves together. This workflow is therefore
# the one place that knows how to deploy, and it runs in three situations:
#
#   push               a commit lands on master here (frontend change)
#   workflow_call      html-resume-backend calls it after a backend change
#   workflow_dispatch  manual re-deploy from the Actions tab
#
# Both repos are public, so the backend can call this directly with
# `uses: saviong/html-resume-frontend/.github/workflows/deploy-swa.yml@master`
# and no cross-repo personal access token is needed.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: true

# Queue overlapping deploys rather than letting two uploads race.
concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Both checkouts name their repository explicitly: when the backend calls
      # this workflow, the default checkout target would be the backend.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: saviong/html-resume-frontend
          ref: master
          # Never write the Actions token into .git/config. A previous workflow
          # uploaded the whole repo, .git included, to a public container, which
          # published a live GITHUB_TOKEN on every deploy.
          persist-credentials: false

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: saviong/html-resume-backend
          ref: master
          path: backend
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: 'backend/.python_version'

      # Gate the deploy on the API's own tests. This protects both entry points:
      # a frontend push deploys backend code it never otherwise tested.
      - name: Test API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest test -v

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html staticwebapp.config.json _site/
          cp -r pic _site/
          find _site -name '.DS_Store' -delete

      # Only what the Functions host needs: no tests, ARM templates or Archive/.
      # Oryx installs requirements.txt during the deploy. If those deps ever fail
      # to land, the Python worker cannot import them, no functions are indexed,
      # and /api/* returns a bare 404 with no error surfaced anywhere.
      # (The local `swa deploy` CLI skips Oryx, so it needs deps vendored into
      #  api/.python_packages/lib/site-packages instead.)
      - name: Stage API
        run: |
          mkdir -p api
          cp backend/function_app.py backend/host.json backend/requirements.txt api/

      # Belt and braces: fail loudly rather than publish anything sensitive.
      - name: Verify nothing sensitive is staged
        run: |
          fail=0
          for d in _site api; do
            while IFS= read -r f; do
              case "$f" in
                */.git/*|*/.git|*/.github/*|*.pem|*.key|*local.settings.json|*/.env|*.DS_Store)
                  echo "::error::refusing to deploy sensitive path: $f"; fail=1 ;;
              esac
            done < <(find "$d" -mindepth 1)
          done
          if grep -rIlE '(ghp_|ghs_|github_pat_)[A-Za-z0-9]{20,}|AccountKey=[A-Za-z0-9+/=]{40,}' _site api 2>/dev/null | grep -q .; then
            echo "::error::credential-shaped string found in staged output"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "staged output is clean"
          exit "$fail"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_site'
          api_location: 'api'
          skip_app_build: true

      - name: Summary
        run: |
          {
            echo "### Deployed to Azure Static Web Apps"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Triggered by | \`${{ github.event_name }}\` in \`${{ github.repository }}\` |"
            echo "| Site | https://mycv.saviong.com |"
            echo "| API  | https://mycv.saviong.com/api/updateCounter |"
          } >> "$GITHUB_STEP_SUMMARY"
