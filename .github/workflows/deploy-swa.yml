# Deploys the résumé to Azure Static Web Apps (Free plan):
# managed TLS on mycv.saviong.com, global CDN, and the Python API on /api.
#
# The API lives in a separate repo, so it is checked out into api/ here.
# A backend-only change does not trigger this workflow — run it manually
# (Actions -> Deploy to Azure Static Web Apps -> Run workflow) after merging there.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          # Never write the Actions token into .git/config. A previous workflow
          # uploaded the whole repo, .git included, to a public container, which
          # published a live GITHUB_TOKEN on every deploy.
          persist-credentials: false

      - name: Checkout backend into api/
        uses: actions/checkout@v4
        with:
          repository: saviong/html-resume-backend
          ref: master
          path: backend
          persist-credentials: false

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html staticwebapp.config.json _site/
          cp -r pic _site/
          find _site -name '.DS_Store' -delete

      # Only what the Functions host needs: no tests, ARM templates or Archive/.
      # Oryx installs requirements.txt during the deploy. If those deps ever fail
      # to land, the Python worker cannot import them, no functions are indexed,
      # and /api/* returns a bare 404 with no error surfaced anywhere.
      # (The local `swa deploy` CLI skips Oryx, so it needs deps vendored into
      #  api/.python_packages/lib/site-packages instead.)
      - name: Stage API
        run: |
          mkdir -p api
          cp backend/function_app.py backend/host.json backend/requirements.txt api/

      # Belt and braces: fail loudly rather than publish anything sensitive.
      - name: Verify nothing sensitive is staged
        run: |
          fail=0
          for d in _site api; do
            while IFS= read -r f; do
              case "$f" in
                */.git/*|*/.git|*/.github/*|*.pem|*.key|*local.settings.json|*/.env|*.DS_Store)
                  echo "::error::refusing to deploy sensitive path: $f"; fail=1 ;;
              esac
            done < <(find "$d" -mindepth 1)
          done
          if grep -rIlE '(ghp_|ghs_|github_pat_)[A-Za-z0-9]{20,}|AccountKey=[A-Za-z0-9+/=]{40,}' _site api 2>/dev/null | grep -q .; then
            echo "::error::credential-shaped string found in staged output"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "staged output is clean"
          exit "$fail"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_site'
          api_location: 'api'
          skip_app_build: true
